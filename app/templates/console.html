{% extends "base.html" %}{% block title %}{{ bot.display_name }} — Console{% endblock %}{% block content %}
<p class="eyebrow">Live Console</p><h1>{{ bot.display_name }} — Console</h1>
<div class="card console-card">
  <div class="console-toolbar"><strong>Connection: <span id="console-state">Connecting</span></strong><label><input type="checkbox" id="auto-scroll" checked> Auto Scroll</label><label><input type="checkbox" id="show-stdout" checked> stdout</label><label><input type="checkbox" id="show-stderr" checked> stderr</label><button type="button" id="pause-console">Pause</button><button type="button" id="clear-console">Clear Display</button></div>
  <div id="console-output" class="console-output" role="log" aria-live="off" aria-label="Live bot console output"></div>
</div>
<script>
(()=>{"use strict";const output=document.querySelector('#console-output'),state=document.querySelector('#console-state'),pause=document.querySelector('#pause-console'),clear=document.querySelector('#clear-console'),auto=document.querySelector('#auto-scroll'),stdout=document.querySelector('#show-stdout'),stderr=document.querySelector('#show-stderr');let socket,paused=false,retry=1000,closed=false;
function line(record){if(paused||(record.stream==='stdout'&&!stdout.checked)||(record.stream==='stderr'&&!stderr.checked))return;const row=document.createElement('div');row.className=`console-line stream-${record.stream}`;const meta=document.createElement('span');meta.className='console-meta';meta.textContent=`${record.timestamp} ${record.stream} `;const message=document.createElement('span');message.textContent=record.message;row.append(meta,message);output.append(row);while(output.childElementCount>5000)output.firstElementChild.remove();if(auto.checked)output.scrollTop=output.scrollHeight}
function connect(){state.textContent='Connecting';const scheme=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${scheme}://${location.host}/ws/bots/{{ bot.id }}/console`);socket.onopen=()=>{retry=1000;state.textContent='Connected'};socket.onmessage=event=>{const data=JSON.parse(event.data);if(data.type==='console_record')line(data);else if(data.state==='permission_revoked'){closed=true;state.textContent='Permission Revoked'}else if(data.type==='connection'){state.textContent=data.state==='console_unavailable'?'Console Unavailable':'Connected'}};socket.onclose=event=>{if(event.code===4403||event.code===4404){closed=true;state.textContent=event.code===4403?'Permission Revoked':'Access Unavailable';return}state.textContent='Disconnected';if(!closed){setTimeout(connect,retry);retry=Math.min(30000,retry<2000?2000:retry<5000?5000:retry<10000?10000:30000)}}}
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Resume':'Pause'};clear.onclick=()=>output.replaceChildren();connect()})();
</script>{% endblock %}
