{% extends "base.html" %}{% block title %}{{ source.name }}{% endblock %}{% block content %}<p class="eyebrow">{{ bot.display_name }} — Data</p><h1>{{ source.name }}</h1><p>{{ source.description }}</p><div class="card"><div class="editor-meta"><span>Current version <code id="version">{{ data.version }}</code></span><span>{{ data.size }} bytes</span><a href="#history">History</a></div><textarea id="json-editor" class="code-editor" {% if not can_edit %}readonly{% endif %}>{{ data.content }}</textarea><div id="editor-message" class="muted"></div>{% if can_edit %}<div class="actions"><button type="button" id="validate">Validate</button><button type="button" id="format">Format JSON</button><button type="button" id="save">Save</button></div>{% endif %}</div><div class="card" id="history"><h2>History</h2><div id="history-list" class="empty">Loading…</div><pre id="version-diff"></pre></div><script>window.DBMEditor={bot:{{ bot.id|tojson }},source:{{ source.id|tojson }},csrf:{{ csrf_token|tojson }},editable:{{ can_edit|tojson }}};</script><script src="/static/js/data-editor.js"></script>{% endblock %}
