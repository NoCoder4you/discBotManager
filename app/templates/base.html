<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Bot Manager{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',path='/css/app.css') }}"></head><body><div class="layout"><aside><a class="brand" href="/dashboard">Bot Manager</a>{% if user %}<nav><a href="/dashboard">Dashboard</a><a href="/dashboard">{{ 'Bots' if is_owner else 'My Bots' }}</a>{% if is_owner %}<a href="#">Users</a><a href="#">Permissions</a><a href="#">Activity</a><a href="#">Audit Log</a><a href="#">System</a><a href="#">Settings</a>{% else %}<a href="#">My Activity</a><a href="#">Account</a>{% endif %}</nav>{% endif %}</aside><main><header>{% if user %}<span>{{ user.display_name }}</span><form method="post" action="/auth/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Log out</button></form>{% endif %}</header><section class="content">{% block content %}{% endblock %}</section></main></div><div id="toasts" aria-live="polite"></div><div id="modal-root"></div><script src="{{ url_for('static',path='/js/app.js') }}" defer></script></body></html>
